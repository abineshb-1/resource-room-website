<svg width="460" height="110" viewBox="0 0 460 110" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Resource Room - Early Learning Support</title>
  <desc>Resource Room logo: open arched door mark in deep teal and linen, wordmark in deep teal and warm amber</desc>

  <!-- Door arch mark -->
  <rect x="16" y="22" width="54" height="68" rx="27" fill="#1A3A4A"/>
  <rect x="25" y="30" width="36" height="60" rx="18" fill="#E8DFD0"/>
  <circle cx="52" cy="62" r="3.5" fill="#1A3A4A"/>

  <!-- Wordmark -->
  <text x="88" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1A3A4A" letter-spacing="-0.8">Resource</text>
  <text x="88" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="400" fill="#C07B3A" letter-spacing="-0.8">Room</text>
  <!-- Tagline -->
  <text x="90" y="103" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#888780" letter-spacing="0.22em">EARLY LEARNING SUPPORT</text>
</svg>
